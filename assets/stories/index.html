<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Bona — Kit Instagram Story</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--navy:#03203d;--navy-deep:#021627;--cream:#f7f7f4;--dim:rgba(247,247,244,.66);--faint:rgba(247,247,244,.34);--line:rgba(247,247,244,.22)}
body{margin:0;background:var(--navy-deep);color:var(--cream);font-family:"Sarabun",system-ui,sans-serif;font-weight:300;padding:64px 40px 100px}
header{text-align:center;margin-bottom:72px}
h1{font-family:"Tangerine",cursive;font-weight:400;font-size:104px;line-height:.92;margin:0}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:var(--faint);margin-bottom:12px}
h2{font-size:11px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--faint);
   border-bottom:1px solid var(--line);padding-bottom:14px;margin:56px 0 26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:26px}
figure{margin:0}
img{width:100%;display:block;border:1px solid var(--line)}
figcaption{margin-top:10px;font-size:12px;letter-spacing:.06em;color:var(--dim)}
</style></head><body>
<header>
  <p class="eyebrow">Brasserie · Bordeaux</p>
  <h1>Kit Instagram Story</h1>
</header>
<h2>Type A — immersive</h2>
<div class="grid">
  <figure><img src="png/story-nous-sommes-ouverts.png" alt="story-nous-sommes-ouverts"><figcaption>story-nous-sommes-ouverts</figcaption></figure>
  <figure><img src="png/story-nous-sommes-ouverts-b.png" alt="story-nous-sommes-ouverts-b"><figcaption>story-nous-sommes-ouverts-b</figcaption></figure>
  <figure><img src="png/story-debut-service.png" alt="story-debut-service"><figcaption>story-debut-service</figcaption></figure>
  <figure><img src="png/story-ce-soir.png" alt="story-ce-soir"><figcaption>story-ce-soir</figcaption></figure>
  <figure><img src="png/story-faim.png" alt="story-faim"><figcaption>story-faim</figcaption></figure>
</div>
<h2>Type B — information</h2>
<div class="grid">
  <figure><img src="png/story-horaires.png" alt="story-horaires"><figcaption>story-horaires</figcaption></figure>
  <figure><img src="png/story-fin-service.png" alt="story-fin-service"><figcaption>story-fin-service</figcaption></figure>
  <figure><img src="png/story-rupture.png" alt="story-rupture"><figcaption>story-rupture</figcaption></figure>
  <figure><img src="png/story-information.png" alt="story-information"><figcaption>story-information</figcaption></figure>
</div>
<h2>Type C — conversion</h2>
<div class="grid">
  <figure><img src="png/story-reservation.png" alt="story-reservation"><figcaption>story-reservation</figcaption></figure>
  <figure><img src="png/story-reservation-b.png" alt="story-reservation-b"><figcaption>story-reservation-b</figcaption></figure>
  <figure><img src="png/story-reservation-ce-soir.png" alt="story-reservation-ce-soir"><figcaption>story-reservation-ce-soir</figcaption></figure>
  <figure><img src="png/story-dernieres-tables.png" alt="story-dernieres-tables"><figcaption>story-dernieres-tables</figcaption></figure>
  <figure><img src="png/story-weekend.png" alt="story-weekend"><figcaption>story-weekend</figcaption></figure>
  <figure><img src="png/story-avis-google.png" alt="story-avis-google"><figcaption>story-avis-google</figcaption></figure>
  <figure><img src="png/story-avis-google-b.png" alt="story-avis-google-b"><figcaption>story-avis-google-b</figcaption></figure>
</div>
<h2>Type D — carte & produit</h2>
<div class="grid">
  <figure><img src="png/story-decouvrez-carte.png" alt="story-decouvrez-carte"><figcaption>story-decouvrez-carte</figcaption></figure>
  <figure><img src="png/story-decouvrez-carte-b.png" alt="story-decouvrez-carte-b"><figcaption>story-decouvrez-carte-b</figcaption></figure>
  <figure><img src="png/story-plat.png" alt="story-plat"><figcaption>story-plat</figcaption></figure>
  <figure><img src="png/story-carte-01-couverture.png" alt="story-carte-01-couverture"><figcaption>story-carte-01-couverture</figcaption></figure>
  <figure><img src="png/story-carte-02-entrees.png" alt="story-carte-02-entrees"><figcaption>story-carte-02-entrees</figcaption></figure>
  <figure><img src="png/story-carte-03-plats.png" alt="story-carte-03-plats"><figcaption>story-carte-03-plats</figcaption></figure>
  <figure><img src="png/story-carte-04-accompagnements.png" alt="story-carte-04-accompagnements"><figcaption>story-carte-04-accompagnements</figcaption></figure>
  <figure><img src="png/story-carte-05-boissons.png" alt="story-carte-05-boissons"><figcaption>story-carte-05-boissons</figcaption></figure>
</div>
<h2>Cartons de table — 90 × 90 mm</h2>
<div class="grid grid--square">
  <figure><img src="png/carte-qr.png" alt="carte-qr"><figcaption>carte-qr</figcaption></figure>
  <figure><img src="png/carte-qr-vierge.png" alt="carte-qr-vierge"><figcaption>carte-qr-vierge</figcaption></figure>
  <figure><img src="png/avis-qr.png" alt="avis-qr"><figcaption>avis-qr</figcaption></figure>
  <figure><img src="png/avis-qr-vierge.png" alt="avis-qr-vierge"><figcaption>avis-qr-vierge</figcaption></figure>
</div>
</body></html>

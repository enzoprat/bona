<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Bona — Carton de table QR carte</title><link rel="stylesheet" href="../kit.css"></head><body>

<!-- FORMAT CARRÉ 90 × 90 mm · carton à poser sur les tables ------------------
     Le QR pointe vers https://bonabordeaux.fr/carte.html
     Pour changer la destination : régénérer ../qr-carte.svg
-------------------------------------------------------------------------- -->
<div class="square">
  <img class="logo" src="../bona-wordmark-cream.svg" alt="Bona">

  <p class="eyebrow mt-40">Brasserie · Bordeaux</p>
  <h1 class="display mt-12">Notre carte</h1>
  <div class="rule mt-20"><i class="lozenge"></i></div>

  <div class="spacer"></div>
  <div class="qr"><img src="../qr-carte.svg" alt="QR — carte Bona"></div>
  <div class="spacer"></div>

  <p class="note">Scannez pour découvrir la carte</p>
</div>
</body></html>

<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Bona — Carton de table (QR à coller)</title><link rel="stylesheet" href="../kit.css"></head><body>

<!-- FORMAT CARRÉ 90 × 90 mm · carton à poser sur les tables ------------------
     Version vierge : carré blanc, QR à coller vous-même.
     Zone blanche : 470 × 470 px (≈ 40 mm) — ne pas réduire.
-------------------------------------------------------------------------- -->
<div class="square">
  <img class="logo" src="../bona-wordmark-cream.svg" alt="Bona">

  <p class="eyebrow mt-40">Brasserie · Bordeaux</p>
  <h1 class="display mt-12">Notre carte</h1>
  <div class="rule mt-20"><i class="lozenge"></i></div>

  <div class="spacer"></div>
  <div class="qr qr--vide"></div>
  <div class="spacer"></div>

  <p class="note">Scannez pour découvrir la carte</p>
</div>
</body></html>

<!doctype html><html lang="fr"><head><meta charset="utf-8">
<title>Bona — Horaires</title><link rel="stylesheet" href="../kit.css"></head><body>

<!-- TYPE B · story information ---------------------------------------------
     Modifier les horaires : une ligne <li> par jour.
     Jour fermé : ajouter la classe "is-closed" sur le <li>.
-------------------------------------------------------------------------- -->
<div class="story">
  <div class="safe center">
    <img class="logo" src="../bona-wordmark-cream.svg" alt="Bona">

    <div class="spacer"></div>

    <p class="eyebrow">Informations</p>
    <h1 class="display d-xl mt-20">Horaires</h1>
    <div class="rule mt-28"><i class="lozenge"></i></div>

    <ul class="hours mt-72">
      <li class="is-closed"><span class="day">Lundi</span>     <span class="val">Fermé</span></li>
      <li class="is-closed"><span class="day">Mardi</span>     <span class="val">Fermé</span></li>
      <li class="is-closed"><span class="day">Mercredi</span>  <span class="val">Fermé</span></li>
      <li class="is-closed"><span class="day">Jeudi</span>     <span class="val">Fermé</span></li>
      <li><span class="day">Vendredi</span> <span class="val">19:00 — 02:00</span></li>
      <li><span class="day">Samedi</span>   <span class="val">19:00 — 02:00</span></li>
      <li><span class="day">Dimanche</span> <span class="val">19:00 — 02:00</span></li>
    </ul>

    <p class="note mt-56">20 rue Sanche de Pomiers · 33000 Bordeaux</p>

    <div class="spacer"></div>
  </div>
</div>
</body></html>
